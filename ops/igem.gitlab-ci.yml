# Builds from reviewed source on every push to main. Never commit igem-build/.
deploy-wiki:
  image: node:24.16.0-bookworm-slim
  stage: deploy
  script:
    - npm ci --include=dev --no-audit --no-fund
    - node scripts/build-igem.mjs
  pages:
    publish: igem-build/public
  artifacts:
    paths:
      - igem-build/public
      - igem-build/publication-report.json
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
