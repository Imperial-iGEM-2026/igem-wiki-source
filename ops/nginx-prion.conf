# Installed inside nginx's http context. Query strings are excluded from access logs.
log_format prion_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
limit_req_zone $http_cf_connecting_ip zone=prion_editor_requests:1m rate=30r/s;
limit_req_zone $binary_remote_addr zone=prion_media_requests:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=prion_media_clients:1m;
limit_conn_zone $server_name zone=prion_media_total:1m;

# The read-only preview and uploaded PDFs may be framed by this same website.
map $uri $prion_frame_ancestors {
    default "'none'";
    /studio-preview "'self'";
    ~^/api/media/[a-f0-9-]+\.pdf$ "'self'";
}

server {
    listen 80;
    listen [::]:80;
    server_name igem2026.gpupods.cloud media-igem2026.gpupods.cloud;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name igem2026.gpupods.cloud;
    ssl_certificate /etc/letsencrypt/live/prion/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prion/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PrionTLS:2m;
    ssl_session_tickets off;
    # The editor can be reached only through Cloudflare's network.
    include /etc/nginx/snippets/prion-cloudflare-allow.conf;
    deny all;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors $prion_frame_ancestors" always;
    access_log /var/log/nginx/prion-editor-access.log prion_safe;
    client_max_body_size 4m; # Matches Node JSON transport limit; code uploads still cap at 128 KiB.
    client_body_timeout 20s;
    limit_req zone=prion_editor_requests burst=60 nodelay;
    limit_req_status 429;
    location ^~ /api/ai/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host igem2026.gpupods.cloud;
        proxy_set_header Connection "";
        proxy_read_timeout 100s;
        # Keep Nginx-generated API failures readable; app JSON errors pass through.
        error_page 403 = @prion_ai_forbidden;
        error_page 413 = @prion_ai_size;
        error_page 429 = @prion_ai_busy;
        error_page 502 503 = @prion_ai_unavailable;
        error_page 504 = @prion_ai_timeout;
        proxy_buffering off;
    }
    location @prion_ai_forbidden {
        default_type application/json;
        return 403 '{"error":"The proxy denied this AI request. Check the editor origin and Cloudflare Access configuration."}';
    }
    location @prion_ai_size {
        default_type application/json;
        return 413 '{"error":"The AI request exceeds the proxy body limit. Select a smaller section."}';
    }
    location @prion_ai_busy {
        default_type application/json;
        return 429 '{"error":"The proxy rate limit was reached. Wait before sending again."}';
    }
    location @prion_ai_unavailable {
        default_type application/json;
        return 502 '{"error":"Nginx could not reach the prion backend. Ask the administrator to check the prion service."}';
    }
    location @prion_ai_timeout {
        default_type application/json;
        return 504 '{"error":"Nginx timed out waiting for AI. Check the AI worker and proxy timeouts."}';
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host igem2026.gpupods.cloud;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name media-igem2026.gpupods.cloud;
    ssl_certificate /etc/letsencrypt/live/prion/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prion/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/prion-media-access.log prion_safe;
    error_log /var/log/nginx/prion-media-error.log crit;
    client_max_body_size 0; # Node validates signed size and available disk space.
    client_body_timeout 60s;
    limit_req zone=prion_media_requests burst=40 nodelay;
    limit_req_status 429;
    limit_conn prion_media_clients 8;
    limit_conn prion_media_total 32;
    limit_conn_status 429;
    # No filesystem is exposed by nginx. Node validates every file ticket.
    location ~ ^/(file|upload)/[a-f0-9-]+\.[a-z0-9]+$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host media-igem2026.gpupods.cloud;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_send_timeout 1800s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1800s;
    }
    # AI (MCP) links. Each request is authorised by the secret key in the
    # query string, which the access log format above never records.
    # Public site bundle for AI previews (no secrets; editor data stays keyed).
    location ~ ^/(assets|templates)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host media-igem2026.gpupods.cloud;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cf-Access-Jwt-Assertion "";
    }
    location ^~ /mcp {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host media-igem2026.gpupods.cloud;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cf-Access-Jwt-Assertion "";
        client_max_body_size 4m; # Matches Node JSON transport limit; code uploads still cap at 128 KiB.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    location / { return 404; }
}
